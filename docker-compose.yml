version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: xihe-postgres
    environment:
      POSTGRES_DB: xihe
      POSTGRES_USER: xihe
      POSTGRES_PASSWORD: xihe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - xihe-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xihe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - xihe-network

  # 羲和后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xihe-backend
    environment:
      - DATABASE_URL=postgresql://xihe:xihe_password@postgres:5432/xihe
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - xihe-network
    restart: unless-stopped

  # 羲和前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xihe-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - xihe-network
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: xihe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - xihe-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  xihe-network:
    driver: bridge